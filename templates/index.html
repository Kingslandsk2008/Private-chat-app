<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAJUU.AI - Think Bold. Chat Smart.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div id="three-container"></div>

  <div id="overlay" class="overlay"></div>
  <div id="alertToast" class="alert-toast">
    <span id="alertIcon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    </span>
    <span id="alertMessage"></span>
  </div>

  <aside id="sidebar" class="sidebar">
    <div class="logo-area">
      <div class="logo-circle">K</div>
      <span class="logo-text">KAJUU.AI</span>
    </div>
    <button class="new-chat-btn" id="newChatBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Chat
    </button>
    <div class="chat-history" id="chatHistory"></div>
    <button class="clear-history-btn" id="clearHistoryBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      Clear History
    </button>
    <div class="user-profile">
      <div class="user-avatar">GU</div>
      <div>
        <div class="user-name">Guest User</div>
        <div class="user-sub">guest</div>
      </div>
    </div>
  </aside>
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <div class="main-wrap" id="mainWrap">
    <nav class="top-nav">
      <input class="chat-title-input" id="chatTitleInput" placeholder="New Chat" readonly/>
      <button class="nav-btn" id="searchBtn" title="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="nav-btn" id="exportBtn" title="Export Chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="nav-btn" id="settingsBtn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 1-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </nav>

    <div class="chat-container" id="chatContainer">
      <div class="chat-container-inner" id="chatInner">
        <div class="welcome-screen" id="welcomeScreen">
          <div class="welcome-logo">K</div>
          <div class="welcome-title">Kajuu</div>
          <div class="welcome-sub">Think Bold. Chat Smart.</div>
          <div class="suggestion-cards" id="suggestionCards">
            <div class="suggestion-card" data-prompt="Write a Python script to analyze CSV data and generate visualizations">
              <span class="card-icon">&#x1F4CA;</span>
              <span class="card-title">Data Analysis</span>
              <span class="card-subtitle">Python for CSV visualization</span>
            </div>
            <div class="suggestion-card" data-prompt="Explain quantum entanglement in simple terms with analogies">
              <span class="card-icon">&#x1F52C;</span>
              <span class="card-title">Explain Concepts</span>
              <span class="card-subtitle">Quantum, simplified</span>
            </div>
            <div class="suggestion-card" data-prompt="Create a 6-month learning path for AI development from scratch">
              <span class="card-icon">&#x1F9E0;</span>
              <span class="card-title">Learning Path</span>
              <span class="card-subtitle">AI dev study roadmap</span>
            </div>
            <div class="suggestion-card" data-prompt="Write a creative story about a robot that learns to dream">
              <span class="card-icon">&#x1F4DD;</span>
              <span class="card-title">Creative Story</span>
              <span class="card-subtitle">A robot who dreams</span>
            </div>
          </div>
        </div>
        <div id="messagesContainer" class="message-list hidden"></div>
      </div>
    </div>

    <div class="input-area">
      <div class="model-selector" id="modelSelector">
        <div class="model-selector-inner" id="modelSelectorInner">
          <button class="model-btn active" data-model="openrouter/free" title="OpenRouter free model router">
            <span class="model-name">Free Router</span>
            <span class="model-provider">OpenRouter</span>
          </button>
        </div>
        <div class="model-selector-scroll" id="modelScrollIndicator">
          <button class="scroll-btn" id="scrollLeft">&#9664;</button>
          <button class="scroll-btn" id="scrollRight">&#9654;</button>
        </div>
        <button class="refresh-models-btn" id="refreshModelsBtn" title="Refresh model list from OpenRouter">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
      </div>
      <div class="input-bar">
        <div class="input-actions">
          <button class="input-btn" id="attachBtn" title="Attach">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83 2.83l-3.53-3.53"/></svg>
          </button>
          <button class="input-btn" id="micBtn" title="Voice">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
          </button>
        </div>
        <textarea id="chatInput" rows="1" placeholder="Message KAJUU..."></textarea>
        <button class="send-btn" id="sendBtn" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <button class="settings-close" id="settingsClose">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <h2>Settings</h2>
    <div class="settings-group">
      <label for="apiKeyInput">API Key</label>
      <div class="input-wrapper">
        <input type="password" id="apiKeyInput" placeholder="sk-or-v1-..."/>
        <button class="toggle-vis" id="toggleApiVisibility">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div class="settings-group">
      <label for="styleSelect">Response style</label>
      <select id="styleSelect">
        <option value="creative">Creative</option>
        <option value="balanced" selected>Balanced</option>
        <option value="precise">Precise</option>
      </select>
    </div>
    <div class="settings-group">
      <label>Font size: <span id="fontSizeVal">15</span>px</label>
      <input type="range" id="fontSlider" min="12" max="20" step="1" value="15"/>
    </div>
    <button class="danger-btn" id="clearDataBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      Clear all data
    </button>
  </div>

  <script src="/static/js/three-background.js"></script>
  <script src="/static/js/settings.js"></script>
  <script src="/static/js/sidebar.js"></script>
  <script src="/static/js/tools.js"></script>
  <script src="/static/js/chat.js"></script>
  <script src="/static/js/main.js"></script>
</body>
</html>
